# Perfil "local": BD en memoria para desarrollar y probar sin RDS.
# Ejecutar con: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=local"
spring.datasource.url=jdbc:h2:mem:productos;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
