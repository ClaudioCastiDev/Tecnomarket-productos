spring.application.name=pedidos360-productos
server.port=8082

# --- Seguridad: Amazon Cognito (identificadores públicos, no son secretos) ---
# Se pueden sobreescribir con variables de entorno en la EC2.
app.security.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_pSWQKRHyI}
app.security.client-id=${COGNITO_CLIENT_ID:506umnko0aikhdkunuvpmd9n45}

# --- Base de datos (RDS MySQL): credenciales SIEMPRE por variables de entorno ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Actuator: solo health ---
management.endpoints.web.exposure.include=health
